services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - onechapter
    ports:
      - "443:443"
    volumes:
      - ./infra/docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - /etc/onechapter/certs:/etc/onechapter/certs:ro
      - caddy-data:/data
      - caddy-config:/config

  onechapter:
    environment:
      DJANGO_DEBUG: "0"
      ONECHAPTER_ACCESS_MODE: ${ONECHAPTER_ACCESS_MODE:-invite}
      ONECHAPTER_PUBLIC_URL: https://app.onechapter.am

  db-backup:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-onechapter}
      PGUSER: ${POSTGRES_USER:-onechapter}
      PGPASSWORD: ${POSTGRES_PASSWORD:-onechapter}
      ONECHAPTER_S3_BUCKET: ${ONECHAPTER_S3_BUCKET:?ONECHAPTER_S3_BUCKET is required in production}
      AWS_REGION: ${AWS_REGION:-eu-north-1}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    command: ["/bin/sh", "/app/infra/scripts/db-backup.sh", "--loop"]

volumes:
  caddy-data:
  caddy-config:
