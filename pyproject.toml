[project]
name = "onechapter"
version = "0.1.0"
description = "A slow-reading companion: one dense chapter a day, on Telegram and the web."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.10",
    "beautifulsoup4>=4.12",
    "django>=5.2.19,<5.3",
    "ebooklib>=0.18",
    "html2text>=2024.2",
    "lxml>=5.3",
    "mobi>=0.3.3",
    "python-dotenv>=1.0",
    "python-telegram-bot>=21.6",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
onechapter = "onechapter.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
